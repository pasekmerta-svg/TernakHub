name: ternakhub_buleleng
description: "Aplikasi jual beli ternak dan manajemen catatan favorit - Project UTS Mobile"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Networking / REST API
  http: ^1.2.0

  # Database / Backend Supabase
  supabase_flutter: ^2.3.4

  # UI Helper & Typography
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true